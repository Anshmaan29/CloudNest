name: Verify CloudNest
on: [push, pull_request]
jobs:
  brain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/release-safety.test.mjs
      - run: npm run audit:source
      - run: node scripts/audit-public-source.mjs --history
      - run: npm run typecheck
      - run: npm run test:brain
      - run: npm run typecheck:web
      - run: npm run test:web
      - run: npm run test:setup
      - run: npm run build:console
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/swift.sh test
      - run: bash scripts/build-mac.sh
